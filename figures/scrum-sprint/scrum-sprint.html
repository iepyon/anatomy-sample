<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ゴールへのフィードバックループ</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(650px,100% - 32px);margin:64px auto 96px}

1.3"/><g class="iso-dots" data-tone="hi"><circle cx="193.9" cy="130.6" r="0.6"/></g></g></svg></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>巻尺：ゴールまでの残り（スプリントごとに測るフィードバック信号）</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>ブロック：各スプリントで完成したインクリメント</span><span class="iso-key"><svg class="iso-swatch" data-mark="flat" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 6.5 8 3.5 14 6.5 8 9.5Z"/></svg>ホッパーの板：プロダクトバックログの項目</span><span class="iso-key"><svg class="iso-swatch" data-mark="edge" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>クランク1回転＝1スプリント（固定長のタイムボックス）</span></span><span class="iso-caption">ゴールが先にあり、スプリントの数は先に決めない。ゴールのストッパーに付いた巻尺ゲージがキャリッジまでの残りを測り、その値はケーブルで制御箱に送られ、制御箱からモーターへとつながって、輪が一周する。モーターはクランクを一定の速さで回し、1回転が1スプリントにあたる。回転の3分の2はゼネバ車がロックされて動かない（開発期間）。最後の3分の1でピンが溝に入り、車を1コマ送る（スプリントレビュー）。車の上の糸巻きには滑りクラッチがあり、そのスプリントで実際にできた分だけを巻き取ってすべる。1回で巻ける量には上限があり、巻尺が測った残りも超えない。できる量はスプリントごとに上限の6〜10割で揺れるので、残りは毎回測り直す。巻尺が0を指すまでこれを繰り返す。この図では8〜9スプリントで届く。届くと戻しばねがキャリッジを戻し、次のゴールで同じ輪がまた回る。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;

function towardViewer(projection) {

    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {

    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");

const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {

function signedArea(points) {

}

function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);

    const lower = [];

        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)

        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);

    return [...lower.slice(0, -1), ...upper.slice(0, -1)];

function runsOf(flags, want) {
    const count = flags.length;

    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);

            run.push((index + 1) % count);

function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;

    if (height > 0) {
        for (let index = 0; index < count; index++) {

    if (convex) {
        fill = pathOf(convexHull([...top, ...bottom]), true);
    }
    else {
        const parts = [pathOf(oriented(top), true), pathOf(oriented(bottom), true)];

            const lit = (nx * lx + ny * ly + 1) / 2;

            const my = ay + by2;
            const length = Math.hypot(mx, my) || 1;

            .map((run) => pathOf([top[run[0]], ...run.slice(1, -1).map((index) => insetTop[index]), top[run[run.length - 1]]]))

        fill,
        outline: outline.join(""),
        crease: crease.join(""),

}
const ringOf = (plan, steps = 8) => roundedPlan(plan, steps);

function circleRing(cx, cy, radius, steps = 40) {

// Shared model and moving geometry for the sprint feedback rig. No imports: the build
// inlines this file into the page (with `export` stripped), so the browser rebuilds
// the moving parts from exactly the code that drew them at rest.

const SP_N = 6; // slots on the Geneva wheel: it indexes once per sprint, as a clock
const SP_C = 44; // crank centre to Geneva centre
const SP_A = SP_C * Math.sin(Math.PI / SP_N); // crank radius (22): the pin enters each slot radially
const SP_G = [70, 0]; // Geneva wheel centre
const SP_D = [70, -44]; // crank centre, behind the wheel
const SP_PIN_R = 2.4;
const SP_R_OUT = 39; // Geneva wheel rim
const SP_SLOT_W = 3.2; // half-width of a slot
const SP_R_IN = SP_C - SP_A; // the pin's closest approach: where each slot ends
const SP_R_LOCK = 14.5; // concave locking arcs on the wheel
const SP_LOCK_R = 14; // locking disc on the crank shaft
const SP_CUT_R = 39.6; // relief cut in the locking disc that lets the wheel's tips pass
const SP_Z = { gen: 19.5, genTop: 24, arm: 26.5, armTop: 29.5 };
const SP_SPOOL_R = 12;
const SP_CORD_Z = 31.5;
const SP_CAP = (2 * Math.PI * SP_SPOOL_R) / SP_N; // most one sprint can wind: one full index
const SP_TRAVEL = SP_CAP * SP_N; // distance from the start to the Product Goal
const SP_STOP_X = 22; // face of the Product Goal stop
const SP_CAR = { w: 40, d: 32, y: 0, z: 4, top: 10 };
const SP_X0 = SP_STOP_X - SP_CAR.w - SP_TRAVEL; // carriage left edge at the start
const SP_TURN = Math.PI * 2;
const SP_ENTRY = (4 * Math.PI) / 3; // into each crank turn, the pin reaches a slot
const SP_ANCHOR_X = -110;
const SP_SPRING = { y: 16, z: 7, r: 3, turns: 14 };
const SP_SLOTS = 12; // room on the carriage (and tiles in the hopper) for the longest run
const SP_BLOCKS = Array.from({ length: SP_SLOTS }, (_, i) => ({ x: 3 + (i % 4) * 7.2, y: 3 + Math.floor(i / 4) * 9, w: 6.2, d: 8, r: 0.7 }));
const SP_BLOCK_H = 5;
const SP_POST = [36, 16];
const SP_TAPE_Z = 16.5;
const SP_GAUGE = { x: 27.2, y: 16, r: 4.6, z: 14, top: 19 }; // tape gauge on the goal stop
const SP_TAPE_OUT = SP_GAUGE.x - SP_GAUGE.r; // where the tape leaves its case

// What each sprint delivers: the team's throughput varies (0.62–1.0 of a full index), and
// the review caps the next increment at the remaining gap the tape measured. Sprints repeat
// until the gap is zero, so how many it takes comes out of the loop, not out of a plan.
function planFor(seed) {
  let x = (seed * 2654435761 + 97) >>> 0;
  const rand = () => {
    x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0;
    return x / 4294967296;
  };
  const deliveries = [];
  let gap = SP_TRAVEL;
  while (gap > 1e-9 && deliveries.length < SP_SLOTS) {
    const made = SP_CAP * (0.62 + 0.38 * rand());
    const step = Math.min(made, gap);
    deliveries.push(step);
    gap -= step;
  }
  return { deliveries, n: deliveries.length, goal: SP_TURN * deliveries.length };
}

const spWrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));
const spDir = (a) => [Math.cos(a), Math.sin(a)];

// Points on a circle from angle a0 to a1, taking the way round that passes `via`.
function spArc(cx, cy, r, a0, a1, via, count) {
  let sweep = spWrap(a1 - a0);
  const t = spWrap(via - a0);
  const inside = sweep > 0 ? t > 0 && t < sweep : t < 0 && t > sweep;
  if (!inside) sweep -= Math.sign(sweep) * Math.PI * 2;
  const out = [];
  for (let i = 0; i <= count; i++) {
    const a = a0 + (sweep * i) / count;
    out.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  return out;
}

// The six-slot wheel in plan, turned by beta. Slots sit at beta + k·60°, locking arcs between them.
function genevaRing(beta) {
  const [gx, gy] = SP_G;
  const w = SP_SLOT_W;
  const so = Math.sqrt(SP_R_OUT * SP_R_OUT - w * w);
  const mouth = Math.asin(w / SP_R_OUT);
  const gamma = Math.acos((SP_R_OUT ** 2 + SP_C ** 2 - SP_R_LOCK ** 2) / (2 * SP_R_OUT * SP_C));
  const pts = [];
  for (let k = 0; k < SP_N; k++) {
    const al = beta + (k * SP_TURN) / SP_N;
    const [dx, dy] = spDir(al);
    const [nx, ny] = [-dy, dx];
    const at = (s, o) => [gx + dx * s + nx * o, gy + dy * s + ny * o];
    pts.push(at(so, -w), at(SP_R_IN + 2, -w));
    const [ex, ey] = at(SP_R_IN, 0);
    pts.push(...spArc(ex, ey, w, al - Math.PI / 2, al + Math.PI / 2, al + Math.PI, 8).slice(0, -1));
    pts.push(at(SP_R_IN + 2, w), at(so, w));
    const b = al + Math.PI / SP_N;
    pts.push(...spArc(gx, gy, SP_R_OUT, al + mouth, b - gamma, al + mouth + 0.01, 3).slice(1, -1));
    const [lx, ly] = [gx + SP_C * Math.cos(b), gy + SP_C * Math.sin(b)];
    const pa = [gx + SP_R_OUT * Math.cos(b - gamma), gy + SP_R_OUT * Math.sin(b - gamma)];
    const pb = [gx + SP_R_OUT * Math.cos(b + gamma), gy + SP_R_OUT * Math.sin(b + gamma)];
    const a0 = Math.atan2(pa[1] - ly, pa[0] - lx);
    const a1 = Math.atan2(pb[1] - ly, pb[0] - lx);
    pts.push(...spArc(lx, ly, SP_R_LOCK, a0, a1, b + Math.PI, 14));
    const next = al + SP_TURN / SP_N;
    pts.push(...spArc(gx, gy, SP_R_OUT, b + gamma, next - mouth, b + gamma + 0.01, 3).slice(1, -1));
  }
  return pts;
}

const pinAngle = (phi) => phi + Math.PI / 2;
const pinAt = (phi) => [SP_D[0] - SP_A * Math.sin(phi), SP_D[1] + SP_A * Math.cos(phi)];

// The locking disc, its relief cut facing the pin.
function lockRing(phi) {
  const [dx, dy] = SP_D;
  const psi = pinAngle(phi);
  const delta = Math.acos((SP_LOCK_R ** 2 + SP_C ** 2 - SP_CUT_R ** 2) / (2 * SP_LOCK_R * SP_C));
  const pts = spArc(dx, dy, SP_LOCK_R, psi + delta, psi - delta, psi + Math.PI, 40);
  const [qx, qy] = [dx + SP_C * Math.cos(psi), dy + SP_C * Math.sin(psi)];
  const [ax, ay] = pts[pts.length - 1];
  const [bx, by] = pts[0];
  const cut = spArc(qx, qy, SP_CUT_R, Math.atan2(ay - qy, ax - qx), Math.atan2(by - qy, bx - qx), psi + Math.PI, 16);
  return pts.concat(cut.slice(1, -1));
}

// The crank arm: a tapered link from the shaft boss to the pin boss.
function armRing(phi) {
  const [dx, dy] = SP_D;
  const [px, py] = pinAt(phi);
  const r1 = 5.6;
  const r2 = 4.2;
  const u = Math.atan2(py - dy, px - dx);
  const tau = Math.acos((r1 - r2) / SP_A);
  return [
    ...spArc(px, py, r2, u - tau, u + tau, u, 10),
    ...spArc(dx, dy, r1, u + tau, u - tau + Math.PI * 2, u + Math.PI, 12),
  ];
}

// The model: crank travel u (radians since the goal was set) → crank angle, wheel angle,
// sprints done and the carriage's travel, which the spool's slip clutch limits to each delivery.
function sprintState(u, plan) {
  const clamped = Math.max(0, Math.min(plan.goal, u));
  let j = Math.floor(clamped / SP_TURN);
  let f = clamped - j * SP_TURN;
  if (j >= plan.n) {
    j = plan.n - 1;
    f = SP_TURN;
  }
  const phi = Math.PI / 3 + clamped;
  let part = 0;
  let frac = 0;
  const engaged = f >= SP_ENTRY;
  if (engaged) {
    const local = f - SP_ENTRY - Math.PI / 3;
    const toward = Math.atan2(-SP_C + SP_A * Math.cos(local), -SP_A * Math.sin(local));
    part = toward + Math.PI / 3;
    frac = Math.min(1, -part / (Math.PI / 3));
  }
  const beta = (-j * Math.PI) / 3 + part;
  let before = 0;
  for (let i = 0; i < j; i++) before += plan.deliveries[i];
  const travel = before + plan.deliveries[j] * frac;
  return { phi, beta, sprint: j, engaged, frac, travel, gapBefore: SP_TRAVEL - before, gapAfter: SP_TRAVEL - before - plan.deliveries[j], gap: SP_TRAVEL - travel, done: j + (engaged ? frac : 0) };
}

// A concave plate (slots, relief cuts): its inner walls that face the viewer can sit behind the
// plate's own top, so the walls and their lower edges go first and an opaque top covers them.
function concaveSvg(ring, z, h, P, K, { tone = "mid", crease = "faint" } = {}) {
  const e = K.extrude(ring, z, h, P, { convex: false });
  const parts = [`<path class="iso-fill" d="${e.fill}"/>`];
  e.shades.forEach((d, shade) => { if (d) parts.push(`<path class="iso-shade" data-shade="${shade}" d="${d}"/>`); });
  parts.push(`<path class="iso-line iso-edge" data-tone="${tone}" d="${e.outline}"/>`);
  parts.push(`<path class="iso-fill" d="${e.top}"/>`, `<path class="iso-top" d="${e.top}"/>`);
  if (e.crease) parts.push(`<path class="iso-line iso-crease" data-tone="${crease}" d="${e.crease}"/>`);
  parts.push(`<path class="iso-line iso-edge" data-tone="${tone}" d="${K.onTop(ring, z + h, P, true)}"/>`);
  return `<g class="iso-solid">${parts.join("")}</g>`;
}

// Moving parts as SVG strings, drawn with whichever kit object is passed in.
function drawLock(phi, P, K) {
  return concaveSvg(lockRing(phi), SP_Z.gen, SP_Z.genTop - SP_Z.gen, P, K, { tone: "mid" });
}

function drawGeneva(beta, P, K) {
  const [gx, gy] = SP_G;
  const out = [concaveSvg(genevaRing(beta), SP_Z.gen, SP_Z.genTop - SP_Z.gen, P, K, { tone: "hi", crease: "lo" })];
  out.push(K.lineSvg(K.ring(gx, gy, 16.5, SP_Z.genTop, P, 48), { tone: "faint" }));
  const marks = [];
  for (let k = 0; k < SP_N; k++) {
    const b = beta + (k + 0.5) * (SP_TURN / SP_N);
    marks.push(K.iso([gx + 27 * Math.cos(b), gy + 27 * Math.sin(b), SP_Z.genTop], P));
  }
  out.push(K.dotsSvg(marks, { size: 0.5, tone: "mid" }));
  return out.join("");
}

function drawArm(phi, P, K) {
  const [px, py] = pinAt(phi);
  const out = [];
  out.push(K.solidSvg(K.cylinder(px, py, SP_PIN_R, SP_Z.genTop + 0.2, SP_Z.arm - SP_Z.genTop - 0.2, P, 20), { tone: "mid", crease: "none" }));
  out.push(K.solidSvg(K.extrude(armRing(phi), SP_Z.arm, SP_Z.armTop - SP_Z.arm, P, { bevel: 0.4 }), { tone: "mid" }));
  out.push(K.solidSvg(K.cylinder(px, py, 2.6, SP_Z.armTop, 1.4, P, 20), { tone: "mid" }));
  out.push(K.lineSvg(K.ring(SP_D[0], SP_D[1], 2.4, SP_Z.armTop, P, 20), { tone: "lo" }));
  out.push(K.dotsSvg([K.iso([SP_D[0], SP_D[1], SP_Z.armTop], P), K.iso([px, py, SP_Z.armTop + 1.4], P)], { size: 0.5, tone: "mid" }));
  return out.join("");
}

function drawSpoolMark(angle, P, K) {
  const [gx, gy] = SP_G;
  const z = 38;
  const tip = [gx + 13 * Math.cos(angle), gy + 13 * Math.sin(angle)];
  const tail = [gx + 6 * Math.cos(angle), gy + 6 * Math.sin(angle)];
  return K.lineSvg(K.lineOnTop(tail, tip, z, P), { tone: "hi" }) + K.dotsSvg([K.iso([tip[0], tip[1], z], P)], { size: 0.5, tone: "hi" });
}

function drawSpring(left, P, K) {
  const c = K.coil(SP_ANCHOR_X, left, [SP_SPRING.y, SP_SPRING.z], SP_SPRING.r, SP_SPRING.turns, "x", P);
  const ends = [K.iso([SP_ANCHOR_X, SP_SPRING.y + SP_SPRING.r, SP_SPRING.z], P), K.iso([left, SP_SPRING.y + SP_SPRING.r, SP_SPRING.z], P)];
  return K.lineSvg(c.back, { tone: "lo" }) + K.lineSvg(c.front, { tone: "mid" }) + K.dotsSvg(ends, { size: 0.7, tone: "mid" });
}

// The feedback signal: the tape from the gauge case to the carriage post, and the gauge's needle.
function drawTape(left, P, K) {
  const from = [left + SP_POST[0] + 2.2, SP_POST[1], SP_TAPE_Z];
  const to = [SP_TAPE_OUT, SP_POST[1], SP_TAPE_Z];
  return K.lineSvg(K.segment(from, to, P), { tone: "lit" }) + K.dotsSvg([K.iso(from, P)], { size: 0.6, tone: "hi" });
}

function drawNeedle(gap, P, K) {
  const { x, y, top } = SP_GAUGE;
  const a = (gap / SP_TRAVEL) * Math.PI * 1.6 - Math.PI * 0.8;
  const tip = [x + 3.4 * Math.sin(a), y - 3.4 * Math.cos(a)];
  return K.lineSvg(K.lineOnTop([x, y], tip, top + 0.1, P), { tone: "hi", free: "end" }) + K.dotsSvg([K.iso([x, y, top + 0.1], P)], { size: 0.5, tone: "hi" });
}

function drawCord(left, P, K) {
  const from = [left + SP_POST[0] + 2.2, SP_POST[1], SP_CORD_Z];
  const to = [SP_G[0], SP_G[1] + SP_SPOOL_R, SP_CORD_Z];
  return K.lineSvg(K.segment(from, to, P), { tone: "hi" }) + K.dotsSvg([K.iso(from, P)], { size: 0.6, tone: "hi" });
}

const P = {"origin":[304.0422299441167,212.53158402779118],"scale":1.6563247042396938,"azimuth":50,"elevation":34};
const K = { solidSvg, extrude, cylinder, lineSvg, ring, dotsSvg, iso, lineOnTop, coil, segment, onTop };
const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const part = (name) => svg.querySelector('[data-part="' + name + '"]');
const lock = part("lock"), geneva = part("geneva"), arm = part("arm"), mark = part("mark"), spring = part("spring"), cord = part("cord"), tape = part("tape"), needle = part("needle"), carriage = part("carriage");
const blocks = [...svg.querySelectorAll("[data-block]")].sort((a, b) => a.dataset.block - b.dataset.block);
const tiles = [...svg.querySelectorAll("[data-tile]")].sort((a, b) => a.dataset.tile - b.dataset.tile);
const readout = document.querySelector("[data-readout]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const CYCLE = 3.6;
const HOLD = 3.2;
const BACK = 1.9;
const ease = (t) => t * t * (3 - 2 * t);
const clamp01 = (t) => Math.max(0, Math.min(1, t));
const pct = (gap) => Math.round((gap / SP_TRAVEL) * 100);

let u = 0, phase = "run", hold = 0, back = 0, speed = 1, fast = false, paused = false;
let frame = 0, last = 0, visible = false;
let shown = { phi: null, beta: null, travel: null };

  if (st.engaged) return "スプリント " + n + " · レビュー · 残り " + pct(st.gapBefore) + "% → " + pct(st.gapAfter) + "%";
