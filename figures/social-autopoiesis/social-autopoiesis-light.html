<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>接続で自分を産出する社会システム</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(650px,100% - 32px);margin:64px auto 96px}

152.1L275.9 151.7L277.1 151.7L278.3 151.9L279.2 152.3L279.6 152.9L279.5 153.5Z"/></g><g data-part="tips"><path class="iso-line" data-tone="mid" d="M286.1 188.3L286.1 170.7M278.4 183.3L278.4 160.1"/></g><g data-part="yarns"><path class="iso-line" data-tone="hi" d="M292.1 68.5L292.1 27.7M292.1 27.7L276.8 153"/><path class="iso-line" data-tone="lo" d="M310.4 68.5L310.4 27.7M310.4 27.7L276.8 153"/><path class="iso-line" data-tone="lo" d="M328.6 68.5L328.6 27.7M328.6 27.7L276.8 153"/><path class="iso-line" data-tone="lo" d="M346.8 68.5L346.8 27.7M346.8 27.7L276.8 153"/><g class="iso-dots" data-tone="hi"><circle cx="276.8" cy="153" r="0.6"/></g></g><g data-part="snips"></g></svg></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>いま生まれている編み目＝一回のコミュニケーション（次の段に引き抜かれて理解になる）</span><span class="iso-key"><svg class="iso-swatch" data-mark="edge" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>糸＝伝達の候補。太いのが人、細いのがAI。取られなかったAIの糸は切れて消える</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>型紙カード＝決定前提。編み上がった段から次のカードが打ち抜かれる</span><span class="iso-key"><svg class="iso-swatch" data-mark="flat" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 6.5 8 3.5 14 6.5 8 9.5Z"/></svg>編み地＝記録。消えずに桶へたまる</span></span><span class="iso-caption">この機械が産出するのは編み目だけで、編み目は編み目からしか生まれない。カムが針を一本持ち上げた瞬間に一目が生まれ、すぐに過去になる。その目が留まるのは、次の段の輪がそこを引き抜いたときだけで、これがルーマンの言う「理解は次の接続で成立する」にあたる。人もAIもこの機械の外にいて、糸を差し出すだけ。人の糸巻きは一つ、AIの糸巻きは三つで、AIは一目ごとに三本の候補を差し出すが、多くはつながらずに切れて消える。どの糸を取るかは型紙カード（決定前提）が決める。カードは編み上がった段から打ち抜かれ、四段あとに効く。人の糸で二段続けて留まった組はAIへ任され、AIが三段続けた組は人の確認へ戻る。決定が決定前提を作り、決定前提が次の決定を選ぶ。クリックで人の糸を止めると、人を要する目が編めず、二段続けて抜けた針から目が落ち、接続が途切れて系は止まる。編み地（記録）だけは桶にたまり続ける。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {
    const count = flags.length;
    const runs = [];
    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
    if (start < 0)
        return flags[0] === want ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
    let run = null;
    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;
        if (flags[index] === want) {
            if (!run)
                run = [index];
            run.push((index + 1) % count);
        }
        else if (run) {
            runs.push(run);
            run = null;
        }
    }
    if (run)
        runs.push(run);
    return runs;
}
function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;
    const count = ring.length;
    const counter = signedArea(ring) > 0;
    const [vx, vy] = towardViewer(projection);
    const { sinA, cosA } = cameraOf(projection);
    const normals = ring.map(([ax, ay], index) => {
        const [bx, by] = ring[(index + 1) % count];
        const dx = bx - ax;
        const dy = by - ay;
        const length = Math.hypot(dx, dy) || 1;
        return (counter ? [dy / length, -dx / length] : [-dy / length, dx / length]);
    });
    const facing = normals.map(([nx, ny]) => nx * vx + ny * vy > 1e-9);
    const top = ring.map(([x, y]) => iso([x, y, z + height], projection));
    const bottom = ring.map(([x, y]) => iso([x, y, z], projection));
    const outline = [];
    const crease = [];
    for (const run of runsOf(facing, false))
        outline.push(pathOf(run.map((index) => top[index])));
    for (const run of runsOf(facing, true)) {
        crease.push(pathOf(run.map((index) => top[index])));
        if (height > 0)
            outline.push(pathOf(run.map((index) => bottom[index])));
    }
    if (height > 0) {
        for (let index = 0; index < count; index++) {
            if (facing[(index + count - 1) % count] !== facing[index])
                outline.push(pathOf([top[index], bottom[index]]));
        }
    }
    let fill;
    if (convex) {
        fill = pathOf(convexHull([...top, ...bottom]), true);
    }
    else {
        const parts = [pathOf(oriented(top), true), pathOf(oriented(bottom), true)];
        for (let index = 0; index < count; index++) {
            if (!facing[index])
                continue;
            const next = (index + 1) % count;
            parts.push(pathOf(oriented([top[index], top[next], bottom[next], bottom[index]]), true));
        }
        fill = parts.join("");
    }
    const buckets = Array.from({ length: SHADES }, () => []);
    if (height > 0) {
        const [lx, ly] = [-sinA, cosA];
        for (let index = 0; index < count; index++) {
            if (!facing[index])
                continue;
            const [nx, ny] = normals[index];
            const lit = (nx * lx + ny * ly + 1) / 2;
            const shade = Math.min(SHADES - 1, Math.max(0, Math.floor(lit * SHADES)));
            const next = (index + 1) % count;
            buckets[shade].push(pathOf(oriented([top[index], top[next], bottom[next], bottom[index]]), true));
        }
    }
    let bevel;
    if (options.bevel && options.bevel > 0) {
        const by = options.bevel;
        const inset = ring.map(([x, y], index) => {
            const [ax, ay] = normals[(index + count - 1) % count];
            const [bx, by2] = normals[index];
            const mx = ax + bx;
            const my = ay + by2;
            const length = Math.hypot(mx, my) || 1;
            return [x - (mx / length) * by, y - (my / length) * by];
        });
        const insetTop = inset.map(([x, y]) => iso([x, y, z + height], projection));
        bevel = runsOf(facing, true)
            .map((run) => pathOf([top[run[0]], ...run.slice(1, -1).map((index) => insetTop[index]), top[run[run.length - 1]]]))
            .join("");
    }
    return {
        fill,

// Shared model and moving geometry for the circular knitting machine. No imports: the build
// inlines this file into the page (with `export` stripped), so the browser redraws the moving
// parts from exactly the code that drew them at rest. K is the kit.
//
// The machine is Luhmann's autopoiesis of a social system: a stitch is a communication. It exists
// only as the event at the cam, and it is held ("understood") only when the next round's loop is
// pulled through it. Yarn is offered from outside (a person's spool, AI spools); the pattern card,
// punched from rounds already knitted, decides which yarn each needle takes.

const KN_N = 24; // needles round the cylinder
const KN_GROUPS = 8; // pattern groups on a card, three needles each
const KN_CYL = { r: 22, z: 62, top: 84, hole: 16.5 };
const KN_NEEDLE_R = 22.4;
const KN_LIFT = 8; // how far the cam raises a needle above the cylinder top
const KN_CAR = { rIn: 23.4, rOut: 31, z: 66, top: 78, half: 28 }; // the cam carriage (degrees)
const KN_EYE = { r: 24.6, z: 95 }; // the feeder eye on the carriage
const KN_MAST = { a: 225, r: 41, top: 130 };
const KN_FEEDS = [-13, -4.5, 4, 12.5]; // tangential offsets of the guide eyes and spools: person, AI ×3
const KN_SPOOL_Z = 98;
const KN_FAB = { r: 15.5, top: 62, bottom: 12, row: 3 };
const KN_TUB = { r: 26, top: 12 };
const KN_CARD = { a: 315, r0: 47, pitch: 7.6, count: 5, w: 6.4, d: 13, z: 60.6 };
const KN_MISS_DROP = 2; // rounds a needle may miss before its loop runs

const DEG = Math.PI / 180;
const knPolar = (deg, r) => [Math.cos(deg * DEG) * r, Math.sin(deg * DEG) * r];
const knNeedleDeg = (i) => (i * 360) / KN_N;
const knWrap = (d) => ((((d + 180) % 360) + 360) % 360) - 180;
const knLift = (d) => KN_LIFT * Math.exp(-((d / 11) ** 2));
const along = (a, r, t) => {
  const [x, y] = knPolar(a, r);
  return [x - Math.sin(a * DEG) * t, y + Math.cos(a * DEG) * t];
};
const knGuide = (k) => [...along(KN_MAST.a, KN_MAST.r + 3, KN_FEEDS[k]), KN_MAST.top];
const knSpool = (k) => along(KN_MAST.a, KN_MAST.r + 3, KN_FEEDS[k]);

// The pattern a card carries: one of "H" (a person's yarn) or "A" (an AI's yarn) per group.
// The next card is punched from the round just knitted: a group that has held on a person's yarn
// for two rounds is handed to an AI, and a group an AI has held for three rounds goes back to a
// person for review. Decisions make the premises the next decisions are taken under.
function knNextCard(card, streak) {
  return card.map((g, i) => {
    if (g === "H" && streak[i] >= 2) return "A";
    if (g === "A" && streak[i] >= 3) return "H";
    return g;
  });
}

// A concave plate: walls first, then an opaque top over them, then the top outline.
function knConcave(ring, z, h, P, K, { tone = "mid", crease = "faint", lit = false } = {}) {
  const e = K.extrude(ring, z, h, P, { convex: false });
  const parts = [`<path class="iso-fill" d="${e.fill}"/>`];
  e.shades.forEach((d, shade) => { if (d) parts.push(`<path class="iso-shade" data-shade="${shade}" d="${d}"/>`); });
  parts.push(`<path class="iso-line iso-edge" data-tone="${tone}" d="${e.outline}"/>`);
  parts.push(`<path class="iso-fill" d="${e.top}"/>`, `<path class="iso-top" d="${e.top}"/>`);
  if (e.crease) parts.push(`<path class="iso-line iso-crease" data-tone="${crease}" d="${e.crease}"/>`);
  parts.push(`<path class="iso-line iso-edge" data-tone="${tone}" d="${K.onTop(ring, z + h, P, true)}"/>`);
  return `<g class="iso-solid"${lit ? " data-lit" : ""}>${parts.join("")}</g>`;
}

function knSector(a, half, rIn, rOut, steps = 14) {
  const pts = [];
  for (let i = 0; i <= steps; i++) pts.push(knPolar(a - half + (2 * half * i) / steps, rOut));
  for (let i = steps; i >= 0; i--) pts.push(knPolar(a - half + (2 * half * i) / steps, rIn));
  return pts;
}

const knFacing = (deg, P) => {
  const [vx, vy] = [Math.cos((P.azimuth ?? 45) * DEG), Math.sin((P.azimuth ?? 45) * DEG)];
  return Math.cos(deg * DEG) * vx + Math.sin(deg * DEG) * vy;
};

// The cam carriage at angle a, with its crank knob and feeder post and arm.
function knCarriage(a, P, K) {
  const c = KN_CAR;
  const out = [knConcave(knSector(a, c.half, c.rIn, c.rOut), c.z, c.top - c.z, P, K, { tone: "mid" })];
  const seam = [];
  for (let i = 0; i <= 16; i++) {
    const [x, y] = knPolar(a - c.half + (2 * c.half * i) / 16, c.rOut);
    seam.push([x, y]);
  }
  out.push(K.lineSvg(K.onTop(knSector(a, c.half - 4, c.rIn + 1.6, c.rOut - 1.6, 12), c.top, P, true), { tone: "faint" }));
  const [hx, hy] = knPolar(a + c.half - 7, 33.8);
  const [nx, ny] = knPolar(a + c.half - 7, c.rOut - 1);
  out.push(K.solidSvg(K.extrude(knSector(a + c.half - 7, 2.6, c.rOut - 1.5, 34.6, 4), c.top - 3, 2.6, P), { tone: "mid", crease: "none" }));
  out.push(K.solidSvg(K.cylinder(hx, hy, 2, c.top - 0.4, 9, P, 16), { tone: "mid", inner: K.lineSvg(K.knurl(hx, hy, 2, c.top - 0.4, c.top + 8.6, 12, P, 0.2), { tone: "faint" }) }));
  out.push(K.dotsSvg([K.iso([nx, ny, c.top - 0.4], P)], { size: 0.4, tone: "lo" }));
  const [px, py] = knPolar(a - 15, c.rOut - 2.4);
  const [ex0, ey0] = knPolar(a, KN_EYE.r);
  out.push(K.solidSvg(K.cylinder(px, py, 1.5, c.top, KN_EYE.z - c.top + 1, P, 14), { tone: "mid", crease: "none" }));
  const ux = ex0 - px, uy = ey0 - py, ul = Math.hypot(ux, uy);
  const [nx2, ny2] = [(-uy / ul) * 1.1, (ux / ul) * 1.1];
  const bar = [[px - nx2, py - ny2], [ex0 - nx2 + (ux / ul) * 1.6, ey0 - ny2 + (uy / ul) * 1.6], [ex0 + nx2 + (ux / ul) * 1.6, ey0 + ny2 + (uy / ul) * 1.6], [px + nx2, py + ny2]];
  out.push(K.solidSvg(K.extrude(bar, KN_EYE.z - 0.6, 1.6, P), { tone: "mid", crease: "none" }));
  out.push(K.dotsSvg([K.iso([px, py, KN_EYE.z + 1], P)], { size: 0.4, tone: "lo" }));
  const [ex, ey] = knPolar(a, KN_EYE.r);
  out.push(K.lineSvg(K.ring(ex, ey, 1.3, KN_EYE.z + 1, P, 14), { tone: "lo" }));
  return out.join("");
}

// Needles. part "front": the visible half, full length. "tips": the part above `from` of every
// needle the cam has raised over it.
function knNeedles(camDeg, litIndex, P, K, part, from = KN_CYL.top) {
  const lines = [];
  let lit = "";
  for (let i = 0; i < KN_N; i++) {
    const deg = knNeedleDeg(i);
    const lift = knLift(knWrap(deg - camDeg));
    const tip = KN_CYL.top + lift;
    const [x, y] = knPolar(deg, KN_NEEDLE_R);
    let z0;
    if (part === "front") {
      if (knFacing(deg, P) <= 0.05) continue;
      z0 = KN_CYL.z;
    } else {
      if (lift < 0.3 || tip <= from + 0.3) continue;
      z0 = from;
    }
    const d = K.segment([x, y, z0], [x, y, tip], P);
    if (i === litIndex && lift > 1) lit = K.lineSvg(d, { tone: "lit" }).replace("<path ", '<path style="stroke-width:1.3" ') + K.dotsSvg([K.iso([x, y, tip], P)], { size: 0.8, tone: "hi" });
    else lines.push(d);
  }
  return K.lineSvg(lines.join(""), { tone: "mid" }) + lit;
}

// The yarns: from each spool up to its guide eye, then down to the feeder eye on the carriage.
// The yarn that the stitch takes runs on from the eye to the needle at the cam (lit).
function knYarns(camDeg, feeds, take, P, K) {
  const [ex, ey] = knPolar(camDeg, KN_EYE.r);
  const eye = [ex, ey, KN_EYE.z + 1];
  const out = [];
  feeds.forEach((on, k) => {
    if (!on) return;
    const g = knGuide(k);
    const [sx, sy] = knSpool(k);
    const tone = k === 0 ? "hi" : "lo";
    out.push(K.lineSvg(K.segment([sx, sy, KN_SPOOL_Z + 10], g, P) + K.segment(g, eye, P), { tone }));
  });
  if (take >= 0) {
    const i = Math.round(camDeg / (360 / KN_N)) % KN_N;
    const [nx, ny] = knPolar(knNeedleDeg(i), KN_NEEDLE_R);
    out.push(K.lineSvg(K.segment(eye, [nx, ny, KN_CYL.top + KN_LIFT * 0.9], P), { tone: "lit" }));
  }
  out.push(K.dotsSvg([K.iso(eye, P)], { size: 0.6, tone: "hi" }));
  return out.join("");
}

// Cut candidates: short ends that drop from the eye and fade.
function knSnippets(list, P, K) {
  return list
    .map((s) => {
      const t = s.t;
      const [x, y] = knPolar(s.deg, KN_EYE.r + 2 + t * 6);
      const z = KN_EYE.z - t * t * 14;
      const d = K.segment([x, y, z], [x + Math.cos(s.tilt) * 1.6, y + Math.sin(s.tilt) * 1.6, z - 2.2], P);
      return `<g opacity="${(1 - t).toFixed(2)}">${K.lineSvg(d, { tone: "lo", free: true })}</g>`;
    })
    .join("");
}

// The fabric: the record of every stitch that held, moving down into the tub as rounds are added.
// rows[0] is the newest finished round; each row lists "H", "A" or "x" (dropped) per needle.
function knFabric(rows, phase, P, K) {
  const f = KN_FAB;
  const out = [];
  out.push(K.solidSvg(K.cylinder(0, 0, f.r, f.bottom, f.top - f.bottom, P, 48), { tone: "mid", crease: "none" }));
  const arcs = [];
  const hMarks = [];
  const aMarks = [];
  const ladders = [];
  for (let k = 0; k < rows.length; k++) {
    const z = f.top - (k + phase) * f.row - 1.5;
    if (z < f.bottom + 1 || z > f.top - 0.5) continue;
    arcs.push(K.sideArc(0, 0, f.r, z, P, 40));
    rows[k].forEach((g, i) => {
      if (!g) return;
      const deg = knNeedleDeg(i);
      if (knFacing(deg, P) < 0.18) return;
      const [x0, y0] = knPolar(deg - 2.6, f.r);
      const [x1, y1] = knPolar(deg, f.r);
      const [x2, y2] = knPolar(deg + 2.6, f.r);
      const d = K.segment([x0, y0, z + f.row * 0.8], [x1, y1, z], P) + K.segment([x1, y1, z], [x2, y2, z + f.row * 0.8], P);
      if (g === "H") hMarks.push(d);
      else if (g === "A") aMarks.push(d);
      else ladders.push(K.segment([x1, y1, z], [x1, y1, z + f.row], P));
    });
  }
  out.push(K.lineSvg(arcs.join(""), { tone: "faint" }));
  out.push(K.lineSvg(aMarks.join(""), { tone: "lo" }));
  out.push(K.lineSvg(hMarks.join(""), { tone: "hi" }));
  if (ladders.length) out.push(K.lineSvg(ladders.join(""), { tone: "hi" }));
  return out.join("");
}

// The pattern cards on their track, read at the inner end, punched at the outer end.
// cards[0] is the card at the reader. Each card shows its groups: a dot for "H", a ring for "A".
function knCards(cards, shift, P, K) {
  const c = KN_CARD;
  const out = [];
  const items = [];
  cards.forEach((card, j) => {
    const r = c.r0 + (j + 1 - shift) * c.pitch;
    if (r < c.r0 - 0.5) return;
    const ring = knSector(c.a, (c.d / 2 / r) * (180 / Math.PI), r - c.w / 2, r + c.w / 2, 3);
    const svg = [K.solidSvg(K.extrude(ring, c.z, 0.7, P), { tone: "hi", crease: "lo" })];
    const dots = [];
    const rings = [];
    card.forEach((g, i) => {
      const row = i < 4 ? -1.4 : 1.4;
      const t = ((i % 4) - 1.5) * 2.8;
      const [x, y] = along(c.a, r + row, t);
      if (g === "H") dots.push(K.iso([x, y, c.z + 0.7], P));
      else rings.push(K.ring(x, y, 0.75, c.z + 0.7, P, 10));
    });
    svg.push(K.dotsSvg(dots, { size: 0.65, tone: "hi" }), K.lineSvg(rings.join(""), { tone: "lo" }));
    items.push({ r, svg: svg.join("") });
  });
  // Far cards first: the track runs toward the back-right, so a larger r is further away.
  items.sort((a, b) => b.r - a.r).forEach((it) => out.push(it.svg));
  return out.join("");
}

function knTubFill(level, P, K) {
  const z = 2.4 + level * (KN_TUB.top - 4);
  return K.lineSvg(K.ring(0, 0, KN_TUB.r - 3.2, z, P, 48), { tone: "faint" });
}

const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");

const readout = document.querySelector("[data-readout]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const ROUND = 6.4; // seconds per turn of the cam

let current = new Array(KN_N).fill(null);
let streak = new Array(KN_GROUPS).fill(0);
let misses = new Array(KN_N).fill(0);
let feeds = [true, true, true, true];
let cam = 100, next = Math.ceil(100 / STEP), shift = 0, take = -1, takeT = 0, stopped = false, droppedAt = -1;
let conn = 0, offered = 0, aiConn = 0;
let snips = [];
let speed = 1, fast = false, frame = 0, last = 0, visible = false, seed = 7;
const rand = () => { seed ^= seed << 13; seed >>>= 0; seed ^= seed >>> 17; seed ^= seed << 5; seed >>>= 0; return seed / 4294967296; };
for (let i = 0; i < next; i++) current[i] = rows[0][i];
const fmt = (n) => n.toLocaleString("ja-JP");
function say() {
  if (stopped) return "目が落ちた · 接続が途切れて系が止まった（クリックで再開）";
  const pct = offered ? Math.round((aiConn / offered) * 100) : 0;
  if (!feeds[0]) {
    const risk = misses.filter((m) => m > 0).length;
    return "人の糸なし · 人を要する目が編めない（落ちかけ " + risk + " 目）";
  }
  return "接続 " + fmt(conn) + " · AIの候補 " + fmt(offered) + " 件のうち " + pct + "% が接続";
}
function stitch(i) {
  const need = cards[0][Math.floor(i / 3)];
  const deg = knNeedleDeg(i);
  const cut = (n) => { for (let c = 0; c < n; c++) snips.push({ deg: deg + (rand() - 0.5) * 6, tilt: rand() * Math.PI * 2, t: 0 }); };
  offered += 3;
  if (need === "H") {
    cut(3);
    if (feeds[0]) { current[i] = "H"; misses[i] = 0; conn++; take = 0; }
    else { current[i] = "x"; misses[i]++; take = -1; if (misses[i] >= KN_MISS_DROP && !stopped) { stopped = true; droppedAt = i; } }

    cut(2);
    current[i] = "A"; misses[i] = 0; conn++; aiConn++; take = 1;

}
function endRound() {
  const done = current.map((g) => g || "x");
  for (let g = 0; g < KN_GROUPS; g++) {
    const held = done.slice(g * 3, g * 3 + 3).every((s) => s === cards[0][g]);
    streak[g] = held ? streak[g] + 1 : 0;
  }
  const punched = knNextCard(cards[cards.length - 1], streak);
  for (let g = 0; g < KN_GROUPS; g++) if (punched[g] !== cards[cards.length - 1][g]) streak[g] = 0;

  cards = [...cards.slice(1), punched];
  current = new Array(KN_N).fill(null);
  shift = 1;
}
function draw() {
  const back = knFacing(cam, P) < 0;
  const car = knCarriage(cam, P, K);
  G.carBack.innerHTML = back ? car : "";
  G.carFront.innerHTML = back ? "" : car;
  const lit = Math.round(cam / STEP) % KN_N;
  G.needles.innerHTML = knNeedles(cam, lit, P, K, "front");
  G.tips.innerHTML = knNeedles(cam, lit, P, K, "tips", back ? KN_CYL.top : KN_CAR.top);
  G.yarns.innerHTML = knYarns(cam, feeds, takeT > 0 ? take : -1, P, K);
  G.snips.innerHTML = knSnippets(snips, P, K);
  const shown = [current.map((g, i) => g || (i < next ? "x" : null)).map((g) => g || "-"), ...rows];
  G.fabric.innerHTML = knFabric(shown.map((r) => r.map((g) => (g === "-" ? null : g))), (cam % 360) / 360, P, K);
  G.cards.innerHTML = knCards(cards, shift * shift * (3 - 2 * shift), P, K);
  const text = say();
  if (readout.textContent !== text) readout.textContent = text;
  stage.setAttribute("aria-valuetext", text);
}
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  speed += ((fast ? 3 : 1) - speed) * (1 - Math.exp(-dt / 0.35));
  const step = dt * speed;
  if (!stopped) {
    cam += (step * 360) / ROUND;
    while (next * STEP <= cam) {
      const i = next % KN_N;
      if (i === 0 && next > 0) endRound();
      stitch(i);
      next++;
    }
  }
  takeT = Math.max(0, takeT - step);
  shift = Math.max(0, shift - step / 0.7);
  snips = snips.map((s) => ({ ...s, t: s.t + step / 0.9 })).filter((s) => s.t < 1);
  draw();
  frame = visible && !still.matches ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible && !still.matches) { last = 0; frame = requestAnimationFrame(tick); } };
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
const toggle = () => {
  if (stopped) { stopped = false; feeds[0] = true; misses.fill(0); }
  else feeds[0] = !feeds[0];
  draw();
  run();
};
stage.addEventListener("pointerenter", () => { fast = true; });
stage.addEventListener("pointerleave", () => { fast = false; });
stage.addEventListener("click", toggle);
stage.addEventListener("keydown", (event) => { if (event.key === " " || event.key === "Enter") { event.preventDefault(); toggle(); } });
draw();
run();
